<main class="auth-page">
  <section class="auth-hero">
    <div class="brand-mark">🍽️</div>
    <p class="eyebrow">Softsquare26 Food Ordering</p>
    <h1>ระบบสั่งอาหาร</h1>
    <div class="hero-points">
      <span>Easy order</span>
      <span>Order tracking</span>
      <span>Secure login</span>
    </div>
  </section>

  <section class="auth-card card">
    <p class="eyebrow">{{ mode === 'login' ? 'Member access' : 'New account' }}</p>
    <h2>{{ mode === 'login' ? 'Login' : 'Register' }}</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="stack-form">
      @if (mode === 'register') {
        <label>
          Full name
          <input formControlName="fullName" placeholder="เช่น Boss Engineering" autocomplete="name" />
          @if (form.controls.fullName.touched && form.controls.fullName.invalid) {
            <small class="field-error">กรอกชื่อก่อน</small>
          }
        </label>
      }

      <label>
        Email
        <input formControlName="email" type="email" placeholder="name@example.com" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">อีเมลไม่ถูกต้อง</small>
        }
      </label>

      <label>
        Password
        <input formControlName="password" type="password" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร</small>
        }
      </label>

      @if (error) {
        <div class="alert alert-error">{{ error }}</div>
      }

      <button class="btn btn-primary" type="submit" [disabled]="loading">
        {{ loading ? 'กำลังดำเนินการ...' : (mode === 'login' ? 'Login' : 'Register') }}
      </button>
      <button class="btn btn-soft" type="button" (click)="switchMode()">
        {{ mode === 'login' ? 'Create customer account' : 'Back to login' }}
      </button>
    </form>
  </section>
</main>
